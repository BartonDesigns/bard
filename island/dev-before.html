<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Island dev</title></head>
<body style="margin:0;background:#000">
<script type="module">
import './dist-before/island.js';
const q = new URLSearchParams(location.search);
const w = window.L99IslandModule.island();
// ?planet=MYSTICAL (or ARID, ICE, MAGMA, TOXIC, TERRAN, OCEAN, GAS…) opens another world
const planet = q.get('planet');
// ?at=<code>: a shared spot (share.js)
if (q.get('at')) w.openAt(q.get('at'));
else w.open(planet ? { seed: +(q.get('seed') || 4242), biome: planet, earth: false } : { seed: +(q.get('seed') || 1337) });
</script>
</body></html>
