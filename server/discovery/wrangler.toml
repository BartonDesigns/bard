# The discovery server for Level 99 Bard (see README.md). Everything here is on the Workers
# Free plan: a Worker, two SQLite-backed Durable Objects, the Workers AI binding, one cron.
name = "l99-discovery"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "BRIEFS"
class_name = "BriefStore"

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "Ledger"

# the Free plan only has SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["BriefStore", "Ledger"]

# the nightly round: what is left of the day's allowance goes on the biggest undiscovered
# atlas cities, just before it resets at 00:00 UTC
[triggers]
crons = ["50 23 * * *"]

[vars]
ALLOWED_ORIGINS = "https://level99bard.com,https://www.level99bard.com"
ALLOW_LOCALHOST = "true"
MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
# the model's price in Neurons per million tokens (Workers AI pricing page): change with MODEL
NEURONS_IN_PER_M = "26668"
NEURONS_OUT_PER_M = "204805"
MAX_TOKENS = "2000"
# the day's ceiling, under the free 10,000 (the rest is headroom; capped at 9,500 in code)
DAILY_NEURONS = "8000"
RATE_PER_HOUR = "12"
WAIT_MS = "25000"
NIGHT_MAX = "30"
