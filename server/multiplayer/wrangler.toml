# The rooms server for Level 99 Bard (see README.md): friends playing together. Workers Free
# plan only: a Worker and one SQLite-backed Durable Object class, with WebSockets.
name = "l99-rooms"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# the Free plan only has SQLite-backed Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[vars]
ALLOWED_ORIGINS = "https://level99bard.com,https://www.level99bard.com"
ALLOW_LOCALHOST = "true"

# Personal reputation is deliberately separate from expiring multiplayer rooms.
[[durable_objects.bindings]]
name = "SOULS"
class_name = "Soul"

[[migrations]]
tag = "v2-souls"
new_sqlite_classes = ["Soul"]

# Shared citizen requests survive both room expiry and every visitor leaving.
[[durable_objects.bindings]]
name = "LIVING"
class_name = "LivingRegion"

[[migrations]]
tag = "v3-living-regions"
new_sqlite_classes = ["LivingRegion"]

# A player's username, password hash and saved progress (src/account.js), one per username.
[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Account"

[[migrations]]
tag = "v4-accounts"
new_sqlite_classes = ["Account"]

# Chat: world, region and group channels, and the groups (src/chat.js), one hub for everyone.
[[durable_objects.bindings]]
name = "CHAT"
class_name = "ChatHub"

[[migrations]]
tag = "v5-chat"
new_sqlite_classes = ["ChatHub"]
